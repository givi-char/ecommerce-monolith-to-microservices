server:
  port: 8090

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:

            - id: product-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/v1/products/**,/api/v1/categories/**,/api/v1/brands/**

            - id: inventory-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/v1/inventory/**

            - id: user-service
              uri: http://localhost:8083
              predicates:
                - Path=/api/v1/auth/**,/api/v1/users/**,/api/v1/admin/**,/api/v1/seller/**

            - id: order-service
              uri: http://localhost:8084
              predicates:
                - Path=/api/v1/orders/**

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics
          - gateway

  endpoint:
    health:
      show-details: always