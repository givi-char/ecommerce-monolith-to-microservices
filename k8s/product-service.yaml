apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service

spec:
  replicas: 1

  selector:
    matchLabels:
      app: product-service

  template:
    metadata:
      labels:
        app: product-service

    spec:
      containers:
        - name: product-service
          image: ecommerce-product-service:latest
          imagePullPolicy: Never

          ports:
            - containerPort: 8081

          env:
            - name: DB_HOST
              value: host.minikube.internal

            - name: DB_PORT
              value: "3306"

            - name: DB_NAME
              value: ecommerce

            - name: DB_USER
              value: root

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ecommerce-secrets
                  key: db-password

            - name: SPRING_DATASOURCE_URL
              value: "jdbc:mysql://host.minikube.internal:3306/ecommerce?sslMode=DISABLED&allowPublicKeyRetrieval=true"

          startupProbe:
            tcpSocket:
              port: 8081
            periodSeconds: 5
            failureThreshold: 60

          readinessProbe:
            tcpSocket:
              port: 8081
            periodSeconds: 10
            failureThreshold: 3

          livenessProbe:
            tcpSocket:
              port: 8081
            periodSeconds: 15
            failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: product-service

spec:
  selector:
    app: product-service

  ports:
    - protocol: TCP
      port: 8081
      targetPort: 8081

  type: ClusterIP