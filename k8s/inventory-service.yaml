apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: inventory-service
  template:
    metadata:
      labels:
        app: inventory-service
    spec:
      containers:
        - name: inventory-service
          image: ecommerce-inventory-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8082

          env:
            - name: DB_HOST
              value: host.minikube.internal

            - name: DB_PORT
              value: "3306"

            - name: DB_NAME
              value: ecommerce

            - name: DB_USER
              value: root

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ecommerce-secrets
                  key: db-password

          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            periodSeconds: 5
            failureThreshold: 12

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8082
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8082
            periodSeconds: 15

---
apiVersion: v1
kind: Service
metadata:
  name: inventory-service
spec:
  selector:
    app: inventory-service

  ports:
    - protocol: TCP
      port: 8082
      targetPort: 8082

  type: ClusterIP