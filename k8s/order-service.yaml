apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service

spec:
  replicas: 2

  selector:
    matchLabels:
      app: order-service

  template:
    metadata:
      labels:
        app: order-service

    spec:
      containers:
        - name: order-service
          image: ecommerce-order-service:latest
          imagePullPolicy: Never

          ports:
            - containerPort: 8084

          env:
            - name: DB_HOST
              value: host.minikube.internal

            - name: DB_PORT
              value: "3306"

            - name: DB_NAME
              value: ecommerce

            - name: DB_USER
              value: root

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ecommerce-secrets
                  key: db-password

            - name: JWT_ACCESS_SECRET
              valueFrom:
                secretKeyRef:
                  name: ecommerce-secrets
                  key: jwt-access-secret

            - name: PRODUCT_SERVICE_URL
              value: http://product-service:8081

            - name: INVENTORY_SERVICE_URL
              value: http://inventory-service:8082

          startupProbe:
            tcpSocket:
              port: 8084
            periodSeconds: 5
            failureThreshold: 60

          readinessProbe:
            tcpSocket:
              port: 8084
            periodSeconds: 10
            failureThreshold: 3

          livenessProbe:
            tcpSocket:
              port: 8084
            periodSeconds: 15
            failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: order-service

spec:
  selector:
    app: order-service

  ports:
    - protocol: TCP
      port: 8084
      targetPort: 8084

  type: ClusterIP