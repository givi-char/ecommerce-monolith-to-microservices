apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway

spec:
  replicas: 2

  selector:
    matchLabels:
      app: api-gateway

  template:
    metadata:
      labels:
        app: api-gateway

    spec:
      containers:
        - name: api-gateway
          image: ecommerce-api-gateway:latest
          imagePullPolicy: Never

          ports:
            - containerPort: 8090

          env:
            - name: PRODUCT_SERVICE_URL
              value: http://product-service:8081

            - name: INVENTORY_SERVICE_URL
              value: http://inventory-service:8082

            - name: USER_SERVICE_URL
              value: http://user-service:8083

            - name: ORDER_SERVICE_URL
              value: http://order-service:8084

          startupProbe:
            tcpSocket:
              port: 8090
            periodSeconds: 5
            failureThreshold: 18

          readinessProbe:
            tcpSocket:
              port: 8090
            periodSeconds: 10
            failureThreshold: 3

          livenessProbe:
            tcpSocket:
              port: 8090
            periodSeconds: 15
            failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway

spec:
  selector:
    app: api-gateway

  ports:
    - protocol: TCP
      port: 8090
      targetPort: 8090
      nodePort: 30090

  type: NodePort