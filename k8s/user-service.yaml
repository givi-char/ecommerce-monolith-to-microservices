apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service

spec:
  replicas: 1

  selector:
    matchLabels:
      app: user-service

  template:
    metadata:
      labels:
        app: user-service

    spec:
      containers:
        - name: user-service
          image: ecommerce-user-service:latest
          imagePullPolicy: Never

          ports:
            - containerPort: 8083

          env:
            - name: DB_HOST
              value: host.minikube.internal

            - name: DB_PORT
              value: "3306"

            - name: DB_NAME
              value: ecommerce

            - name: DB_USER
              value: root

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ecommerce-secrets
                  key: db-password

            - name: JWT_ACCESS_SECRET
              valueFrom:
                secretKeyRef:
                  name: ecommerce-secrets
                  key: jwt-access-secret

            - name: JWT_REFRESH_SECRET
              valueFrom:
                secretKeyRef:
                  name: ecommerce-secrets
                  key: jwt-refresh-secret

          startupProbe:
            tcpSocket:
              port: 8083
            periodSeconds: 5
            failureThreshold: 18

          readinessProbe:
            tcpSocket:
              port: 8083
            periodSeconds: 10
            failureThreshold: 3

          livenessProbe:
            tcpSocket:
              port: 8083
            periodSeconds: 15
            failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: user-service

spec:
  selector:
    app: user-service

  ports:
    - protocol: TCP
      port: 8083
      targetPort: 8083

  type: ClusterIP